version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DB_PATH=/data/cogload.db
    volumes:
      - cogload_data:/data
      - ./ml/saved_models:/app/ml/saved_models:ro
    restart: unless-stopped

volumes:
  cogload_data:
